<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunel's Story - E-Kitab Yükləmə Portalı</title>
    <!-- Rəngli PDF Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23EF4444%22/><text x=%2250%22 y=%2264%22 font-size=%2240%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22Plus Jakarta Sans, sans-serif%22>PDF</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #F8FAFC;
            --primary-lux: #0F172A;
            --accent-gold: #3B82F6;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --white: #ffffff;
            --success: #10B981;
            --danger: #EF4444;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius-lg: 16px;
            --radius-sm: 8px;
            --transition: all .2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
        }

        .header {
            text-align: center;
            margin-top: 12px;
        }

        /* Yalnız loqo sahəsi və böyüdülmüş ölçü */
        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            height: 64px; /* Loqonun ölçüsü bir qədər böyüdüldü */
            width: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        /* Minimalist Tailwind tərzi kart dizaynı */
        .container {
            background: var(--white);
            border: 1px solid #E2E8F0;
            padding: 32px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: auto 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--white);
            border: 1px solid #CBD5E1;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        input:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            background: var(--primary-lux);
            color: white;
            border: none;
            padding: 12px 16px;
            width: 100%;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        button:hover {
            background: #1E293B;
        }

        button:active {
            transform: scale(0.99);
        }

        #message {
            margin-top: 16px;
            font-size: 0.875rem;
            font-weight: 500;
            min-height: 20px;
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="logo.jpg" alt="Gunel's Story Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
    </div>

    <div class="container">
        <h1>E-Kitabını Yüklə</h1>
        <p>WhatsApp vasitəsilə əldə etdiyiniz unikal birdəfəlik giriş kodunu aşağıya daxil edin.</p>
        
        <div class="input-group">
            <input type="text" id="userCode" placeholder="GNL-XXXX">
        </div>
        
        <button onclick="verifyAndDownload()" id="downloadBtn">Yükləməni Başlat</button>
        <div id="message"></div>
    </div>

    <div class="footer">
        &copy; 2026 Gunel's Story. Bütün hüquqlar qorunur.
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWqLPM2X89vyqOYocw4KEBh65WKMutZOI",
            authDomain: "gunelsstory-6d3a9.firebaseapp.com",
            projectId: "gunelsstory-6d3a9",
            storageBucket: "gunelsstory-6d3a9.firebasestorage.app",
            messagingSenderId: "903174908342",
            appId: "1:903174908342:web:f73871214550442e553917",
            measurementId: "G-5Q48RSFFH9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function verifyAndDownload() {
            const inputField = document.getElementById("userCode");
            const messageDiv = document.getElementById("message");
            const btn = document.getElementById("downloadBtn");
            const code = inputField.value.trim().toUpperCase();

            if (!code) {
                messageDiv.style.color = "var(--danger)";
                messageDiv.textContent = "Zəhmət olmasa kodu daxil edin.";
                return;
            }

            messageDiv.style.color = "var(--text-main)";
            messageDiv.textContent = "Kod yoxlanılır...";
            btn.disabled = true;

            try {
                const docRef = db.collection("codes").doc(code);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const data = docSnap.data();
                    const isUsed = data.used || false;
                    const downloadUrl = data.downloadUrl || data.link;

                    if (isUsed) {
                        messageDiv.style.color = "var(--danger)";
                        messageDiv.textContent = "Bu kod artıq istifadə olunub!";
                        btn.disabled = false;
                        return;
                    }

                    await docRef.update({ used: true });

                    messageDiv.style.color = "var(--success)";
                    messageDiv.textContent = "Kod təsdiqləndi! Yükləmə başlayır...";

                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 1200);

                } else {
                    messageDiv.style.color = "var(--danger)";
                    messageDiv.textContent = "Daxil etdiyiniz kod yanlışdır.";
                    btn.disabled = false;
                }
            } catch (error) {
                messageDiv.style.color = "var(--danger)";
                messageDiv.textContent = "Şəbəkə xətası baş verdi. Yenidən cəhd edin.";
                btn.disabled = false;
            }
        }

        document.getElementById("userCode").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                verifyAndDownload();
            }
        });
    </script>
</body>
</html>
