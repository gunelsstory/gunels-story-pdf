<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunels Story - E-Kitab Yükləmə Portalı</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin: auto 0;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        button {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
        }
        .footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">✨ Gunels Story</div>
    </div>

    <div class="container">
        <h1>E-Kitabını Yüklə</h1>
        <p>WhatsApp vasitəsilə əldə etdiyiniz unikal birdəfəlik giriş kodunu daxil edin.</p>
        
        <div class="input-group">
            <input type="text" id="userCode" placeholder="GNL-XXXX">
        </div>
        
        <button onclick="verifyCode()">Yükləməni Başlat</button>
        <div id="message"></div>
    </div>

    <div class="footer">
        &copy; 2026 Gunels Story. Bütün hüquqlar qorunur.
    </div>

<script>
    // Etibarlı birdəfəlik kodlar və Google Drive birbaşa yükləmə linkləri
    const validCodes = {
        "GNL-7421": "https://drive.google.com/uc?export=download&id=SİZİN_GOOGLE_DRİVE_FAYL_ID_1",
        "GNL-8832": "https://drive.google.com/uc?export=download&id=SİZİN_GOOGLE_DRİVE_FAYL_ID_2"
    };

    function verifyCode() {
        const inputField = document.getElementById("userCode");
        const messageDiv = document.getElementById("message");
        const code = inputField.value.trim().toUpperCase();

        if (!code) {
            messageDiv.style.color = "#f43f5e";
            messageDiv.textContent = "Zəhmət olmasa kodu daxil edin.";
            return;
        }

        if (validCodes[code]) {
            const usedCodes = JSON.parse(localStorage.getItem("used_book_codes") || "[]");

            if (usedCodes.includes(code)) {
                messageDiv.style.color = "#f43f5e";
                messageDiv.textContent = "Bu kod artıq istifadə olunub!";
                return;
            }

            usedCodes.push(code);
            localStorage.setItem("used_book_codes", JSON.stringify(usedCodes));

            messageDiv.style.color = "#38bdf8";
            messageDiv.textContent = "Kod təsdiqləndi, yükləmə başlayır...";

            setTimeout(() => {
                window.location.href = validCodes[code];
            }, 1200);

        } else {
            messageDiv.style.color = "#f43f5e";
            messageDiv.textContent = "Daxil etdiyiniz kod yanlışdır.";
        }
    }
</script>

</body>
</html>
