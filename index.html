<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunel's Story - E-Kitab Yükləmə Portalı</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #FAF8F5;
            --primary-lux: #0F1A5C;
            --accent-gold: #D97706;
            --accent-gold-hover: #B45309;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --white: #ffffff;
            --success: #059669;
            --danger: #DC2626;
            --shadow-lg: 0 30px 70px rgba(15,26,92,.08);
            --radius-lg: 24px;
            --radius-sm: 12px;
            --transition: all .35s cubic-bezier(.16,1,.3,1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            background-image: radial-gradient(rgba(15,26,92,.03) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-lux);
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(15, 26, 92, 0.08);
            padding: 45px 35px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            text-align: center;
            margin: auto 0;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--primary-lux);
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            background: #F8FAFC;
            border: 2px solid rgba(15, 26, 92, 0.1);
            border-radius: var(--radius-sm);
            color: var(--primary-lux);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 3px;
            font-weight: 700;
            text-transform: uppercase;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-lux);
            background: white;
            box-shadow: 0 0 0 4px rgba(15,26,92,.06);
        }

        button {
            background: var(--primary-lux);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(15,26,92,.15);
        }

        button:hover {
            transform: translateY(-2px);
            background: #09103b;
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            margin-top: 20px;
            font-size: 0.92rem;
            font-weight: 600;
            min-height: 24px;
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">✨ Gunel's Story</div>
    </div>

    <div class="container">
        <h1>E-Kitabını Yüklə</h1>
        <p>WhatsApp vasitəsilə əldə etdiyiniz unikal birdəfəlik giriş kodunu aşağıya daxil edin.</p>
        
        <div class="input-group">
            <input type="text" id="userCode" placeholder="GNL-XXXX">
        </div>
        
        <button onclick="verifyAndDownload()" id="downloadBtn">Yükləməni Başlat</button>
        <div id="message"></div>
    </div>

    <div class="footer">
        &copy; 2026 Gunel's Story. Bütün hüquqlar qorunur.
    </div>

    <!-- Firebase SDK (Admin panellə eyni versiya) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDWqLPM2X89vyqOYocw4KEBh65WKMutZOI",
            authDomain: "gunelsstory-6d3a9.firebaseapp.com",
            projectId: "gunelsstory-6d3a9",
            storageBucket: "gunelsstory-6d3a9.firebasestorage.app",
            messagingSenderId: "903174908342",
            appId: "1:903174908342:web:f73871214550442e553917",
            measurementId: "G-5Q48RSFFH9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function verifyAndDownload() {
            const inputField = document.getElementById("userCode");
            const messageDiv = document.getElementById("message");
            const btn = document.getElementById("downloadBtn");
            const code = inputField.value.trim().toUpperCase();

            if (!code) {
                messageDiv.style.color = "var(--danger)";
                messageDiv.textContent = "Zəhmət olmasa kodu daxil edin.";
                return;
            }

            messageDiv.style.color = "var(--primary-lux)";
            messageDiv.textContent = "Kod yoxlanılır...";
            btn.disabled = true;

            try {
                const docRef = db.collection("codes").doc(code);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const data = docSnap.data();
                    const isUsed = data.used || false;
                    const downloadUrl = data.downloadUrl || data.link;

                    if (isUsed) {
                        messageDiv.style.color = "var(--danger)";
                        messageDiv.textContent = "Bu kod artıq istifadə olunub!";
                        btn.disabled = false;
                        return;
                    }

                    // Kodu bazada 'istifadə olundu' olaraq işarələyirik (birdəfəlik edirik)
                    await docRef.update({ used: true });

                    messageDiv.style.color = "var(--success)";
                    messageDiv.textContent = "Kod təsdiqləndi! Yükləmə başlayır...";

                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 1200);

                } else {
                    messageDiv.style.color = "var(--danger)";
                    messageDiv.textContent = "Daxil etdiyiniz kod yanlışdır.";
                    btn.disabled = false;
                }
            } catch (error) {
                messageDiv.style.color = "var(--danger)";
                messageDiv.textContent = "Şəbəkə xətası baş verdi. Yenidən cəhd edin.";
                btn.disabled = false;
            }
        }

        // Enter düyməsinə basdıqda avtomatik işləməsi üçün
        document.getElementById("userCode").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                verifyAndDownload();
            }
        });
    </script>
</body>
</html>
